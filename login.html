<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>LingkunganKU - Masuk</title>
  <meta name="description" content="Halaman masuk akun LingkunganKU.">
</head>
<body>

  <header>
    <nav aria-label="Navigasi Kembali">
      <a href="index.html">&larr; Kembali</a>
    </nav>
    <h1>LingkunganKU</h1>
  </header>

  <main>
    <section aria-labelledby="login-heading">
      <h2 id="login-heading">Selamat Datang!</h2>
      <p>Masuk untuk melanjutkan</p>

      <form action="#" method="post" id="form-login">

        <fieldset>
          <legend>Informasi Akun</legend>

          <label for="email-atau-telepon">Email atau nomor telepon</label>
          <input
            type="text"
            id="email-atau-telepon"
            name="email_atau_telepon"
            placeholder="Email atau nomor telepon"
            required
            autocomplete="username">

          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Password"
            required
            autocomplete="current-password">

        </fieldset>

        <button type="submit">Masuk</button>

        <p><a href="#">Lupa password?</a></p>

        <p>atau</p>

        <a href="register.html">
          <button type="button">Daftar Akun</button>
        </a>

      </form>
    </section>
  </main>

  <script>
    // Jika sudah login, langsung ke beranda
    if (localStorage.getItem('lingkunganku_nama')) {
      window.location.href = 'index.html';
    }

    document.getElementById('form-login').addEventListener('submit', function (e) {
      e.preventDefault();

      var emailInput = document.getElementById('email-atau-telepon').value.trim();

      // Ambil nama dari akun yang pernah daftar, atau gunakan bagian sebelum @ sebagai nama
      var namaTersimpan = localStorage.getItem('lingkunganku_nama_daftar_' + emailInput);
      var nama = namaTersimpan ? namaTersimpan : emailInput.split('@')[0];

      localStorage.setItem('lingkunganku_nama', nama);
      localStorage.setItem('lingkunganku_email', emailInput);

      window.location.href = 'index.html';
    });
  </script>

</body>
</html>
