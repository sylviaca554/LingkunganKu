<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LingkunganKU - Buat Akun</title>
  <meta name="description" content="Halaman pendaftaran akun baru LingkunganKU.">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-page {
      min-height: 100vh;
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      font-family: var(--font-base);
    }

    .auth-card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.18);
      width: 100%;
      max-width: 680px;
      padding: 3.5rem 4rem;
      animation: fadeUp 0.35s ease-out both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Header Card ── */
    .auth-card-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2.5rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid #f1f5f9;
    }

    .auth-card-logo {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .auth-card-logo img {
      width: 52px;
      height: 52px;
      object-fit: cover;
      border-radius: 14px;
    }

    .auth-card-title h1 {
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--color-primary);
      margin-bottom: 2px;
    }

    .auth-card-title p {
      font-size: 0.8rem;
      color: var(--color-text-muted);
      margin-bottom: 0;
    }

    /* ── Judul Form ── */
    .auth-form-title {
      margin-bottom: 2rem;
    }

    .auth-form-title h2 {
      font-size: 1.75rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 0.4rem;
      letter-spacing: -0.5px;
    }

    .auth-form-title p {
      font-size: 0.9rem;
      color: #64748b;
      margin-bottom: 0;
    }

    /* ── Error Banner ── */
    .auth-error-banner {
      display: none;
      background: #fef2f2;
      border: 1px solid #fca5a5;
      border-radius: 10px;
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      color: #dc2626;
      margin-bottom: 1.5rem;
    }

    .auth-error-banner.visible { display: block; }

    /* ── Grid dua kolom ── */
    .auth-fields-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 1.5rem;
    }

    /* ── Field ── */
    .auth-field {
      margin-bottom: 1.25rem;
    }

    .auth-field label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 0.5rem;
    }

    .auth-field input {
      width: 100%;
      padding: 0.8rem 1rem;
      font-size: 0.9375rem;
      font-family: var(--font-base);
      color: #0f172a;
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      margin-bottom: 0;
    }

    .auth-field input:focus {
      border-color: var(--color-primary);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .auth-field input.input-error {
      border-color: #ef4444;
      background: #fff8f8;
    }

    .field-error {
      display: none;
      font-size: 0.775rem;
      color: #ef4444;
      margin-top: 0.35rem;
    }

    .field-error.visible { display: block; }

    /* ── Indikator Kekuatan Password ── */
    .password-strength {
      display: none;
      margin-top: 0.5rem;
    }

    .password-strength.visible { display: block; }

    .strength-bar {
      height: 4px;
      border-radius: 999px;
      background: #e2e8f0;
      overflow: hidden;
      margin-bottom: 0.3rem;
    }

    .strength-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.3s ease, background 0.3s ease;
      width: 0%;
    }

    .strength-fill.lemah  { width: 33%;  background: #ef4444; }
    .strength-fill.sedang { width: 66%;  background: #f59e0b; }
    .strength-fill.kuat   { width: 100%; background: #16a34a; }

    .strength-label {
      font-size: 0.775rem;
      font-weight: 600;
    }

    .strength-label.lemah  { color: #ef4444; }
    .strength-label.sedang { color: #f59e0b; }
    .strength-label.kuat   { color: #16a34a; }

    /* ── Tombol Daftar ── */
    .auth-btn-primary {
      display: block;
      width: 100%;
      padding: 0.9rem 1rem;
      font-size: 1rem;
      font-weight: 700;
      font-family: var(--font-base);
      color: #ffffff;
      background: var(--color-primary);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s, transform 0.15s;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
      margin-top: 0.25rem;
      letter-spacing: 0.2px;
    }

    .auth-btn-primary:hover {
      background: var(--color-primary-dark);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
    }

    .auth-btn-primary:active { transform: scale(0.99); }

    /* ── Link login ── */
    .auth-login-link {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.875rem;
      color: #64748b;
    }

    .auth-login-link a {
      color: var(--color-primary);
      font-weight: 600;
      text-decoration: none;
    }

    .auth-login-link a:hover { text-decoration: underline; }

    /* ── Link kembali ── */
    .auth-back {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      font-size: 0.8125rem;
      color: #94a3b8;
      text-decoration: none;
      margin-bottom: 2rem;
      transition: color 0.2s;
    }

    .auth-back:hover { color: var(--color-primary); text-decoration: none; }
  </style>
</head>
<body class="auth-page">

  <div class="auth-card">
    <a href="login.html" class="auth-back">&#8592; Kembali ke Login</a>

    <!-- Header -->
    <div class="auth-card-header">
      <div class="auth-card-logo">
        <img src="assets/images/logo.png" alt="Logo LingkunganKU"
          onerror="this.style.display='none'; document.querySelector('.logo-fallback').style.display='block'">
        <span class="logo-fallback" style="display:none; font-size:1.5rem">🌿</span>
      </div>
      <div class="auth-card-title">
        <h1>LingkunganKU</h1>
        <p>Platform Pelaporan Lingkungan</p>
      </div>
    </div>

    <!-- Judul -->
    <div class="auth-form-title">
      <h2>Buat Akun Baru</h2>
      <p>Daftarkan diri Anda untuk mulai menggunakan LingkunganKU</p>
    </div>

    <!-- Error banner -->
    <div class="auth-error-banner" id="error-banner" role="alert" aria-live="polite"></div>

    <form id="form-register" novalidate>
      <!-- Baris 1: Nama & Email -->
      <div class="auth-fields-row">
        <div class="auth-field">
          <label for="nama-lengkap">Nama lengkap</label>
          <input type="text" id="nama-lengkap" name="nama_lengkap"
            placeholder="Masukkan nama lengkap" autocomplete="name">
          <span class="field-error" id="error-nama">Field ini wajib diisi</span>
        </div>

        <div class="auth-field">
          <label for="email-telepon">Email atau nomor telepon</label>
          <input type="text" id="email-telepon" name="email_telepon"
            placeholder="Masukkan email atau no. telepon" autocomplete="username">
          <span class="field-error" id="error-email">Field ini wajib diisi</span>
        </div>
      </div>

      <!-- Baris 2: Password & Konfirmasi -->
      <div class="auth-fields-row">
        <div class="auth-field">
          <label for="password-baru">Password</label>
          <input type="password" id="password-baru" name="password"
            placeholder="Buat password" autocomplete="new-password">
          <div class="password-strength" id="pw-strength">
            <div class="strength-bar">
              <div class="strength-fill" id="strength-fill"></div>
            </div>
            <span class="strength-label" id="strength-label"></span>
          </div>
          <span class="field-error" id="error-password">Field ini wajib diisi</span>
        </div>

        <div class="auth-field">
          <label for="konfirmasi-password">Konfirmasi password</label>
          <input type="password" id="konfirmasi-password" name="konfirmasi_password"
            placeholder="Ulangi password" autocomplete="new-password">
          <span class="field-error" id="error-konfirmasi">Field ini wajib diisi</span>
        </div>
      </div>

      <button type="submit" class="auth-btn-primary">Daftar Sekarang</button>
    </form>

    <div class="auth-login-link">
      Sudah punya akun? <a href="login.html">Masuk di sini</a>
    </div>
  </div>

  <script>
    var sudahLogin = localStorage.getItem('lingkunganku_logged_in') === 'true'
      && Boolean(localStorage.getItem('lingkunganku_nama'))
      && Boolean(localStorage.getItem('lingkunganku_email'));

    if (sudahLogin) {
      window.location.href = 'index.html';
    }

    var form         = document.getElementById('form-register');
    var inputNama    = document.getElementById('nama-lengkap');
    var inputEmail   = document.getElementById('email-telepon');
    var inputPw      = document.getElementById('password-baru');
    var inputKonf    = document.getElementById('konfirmasi-password');
    var errorBanner  = document.getElementById('error-banner');
    var errNama      = document.getElementById('error-nama');
    var errEmail     = document.getElementById('error-email');
    var errPw        = document.getElementById('error-password');
    var errKonf      = document.getElementById('error-konfirmasi');
    var pwStrength   = document.getElementById('pw-strength');
    var strengthFill = document.getElementById('strength-fill');
    var strengthLbl  = document.getElementById('strength-label');

    function hitungKekuatan(pw) {
      if (!pw) return null;
      var jenis = 0;
      if (/[a-z]/.test(pw)) jenis++;
      if (/[A-Z]/.test(pw)) jenis++;
      if (/[0-9]/.test(pw)) jenis++;
      if (/[^a-zA-Z0-9]/.test(pw)) jenis++;
      if (pw.length < 8 || jenis < 2) return 'lemah';
      if (pw.length >= 8 && jenis === 2) return 'sedang';
      return 'kuat';
    }

    inputPw.addEventListener('input', function() {
      inputPw.classList.remove('input-error');
      errPw.classList.remove('visible');
      var pw = inputPw.value;
      if (!pw) { pwStrength.classList.remove('visible'); return; }
      var level = hitungKekuatan(pw);
      pwStrength.classList.add('visible');
      strengthFill.className = 'strength-fill ' + level;
      strengthLbl.className  = 'strength-label ' + level;
      strengthLbl.textContent = 'Kekuatan: ' + { lemah: 'Lemah', sedang: 'Sedang', kuat: 'Kuat' }[level];
    });

    function clearErr(input, errEl) {
      input.classList.remove('input-error');
      errEl.classList.remove('visible');
      errorBanner.classList.remove('visible');
    }

    inputNama.addEventListener('input',  function() { clearErr(inputNama, errNama); });
    inputEmail.addEventListener('input', function() { clearErr(inputEmail, errEmail); });
    inputKonf.addEventListener('input',  function() { clearErr(inputKonf, errKonf); });

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      var nama  = inputNama.value.trim();
      var email = inputEmail.value.trim();
      var pw    = inputPw.value;
      var konf  = inputKonf.value;
      var ok    = true;

      if (!nama)  { inputNama.classList.add('input-error');  errNama.classList.add('visible');                                 ok = false; }
      if (!email) { inputEmail.classList.add('input-error'); errEmail.classList.add('visible');                                ok = false; }
      if (!pw)    { inputPw.classList.add('input-error');    errPw.textContent = 'Field ini wajib diisi';   errPw.classList.add('visible');   ok = false; }
      if (!konf)  { inputKonf.classList.add('input-error');  errKonf.textContent = 'Field ini wajib diisi'; errKonf.classList.add('visible'); ok = false; }
      if (!ok) return;

      if (pw !== konf) {
        inputKonf.classList.add('input-error');
        errKonf.textContent = 'Password dan konfirmasi tidak cocok';
        errKonf.classList.add('visible');
        return;
      }

      var akun = JSON.parse(localStorage.getItem('lingkunganku_accounts') || '[]');
      for (var i = 0; i < akun.length; i++) {
        if (akun[i].email.toLowerCase() === email.toLowerCase()) {
          inputEmail.classList.add('input-error');
          errorBanner.textContent = 'Akun dengan email/telepon ini sudah terdaftar.';
          errorBanner.classList.add('visible');
          return;
        }
      }

      akun.push({ nama: nama, email: email, password: pw });
      localStorage.setItem('lingkunganku_accounts', JSON.stringify(akun));
      localStorage.setItem('lingkunganku_logged_in', 'true');
      localStorage.setItem('lingkunganku_nama', nama);
      localStorage.setItem('lingkunganku_email', email);

      var redirect = localStorage.getItem('lingkunganku_redirect');
      if (redirect) {
        localStorage.removeItem('lingkunganku_redirect');
        window.location.href = redirect;
      } else {
        window.location.href = 'index.html';
      }
    });
  </script>

</body>
</html>
